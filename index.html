<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Read the Book</title>
  <meta name="description" content="Open a PDF, Word file, photo or scan and have it read aloud in a calm, natural voice." />
  <meta name="theme-color" content="#1f2a33" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28" />
      <h1>Read the Book</h1>
    </div>
    <button id="installBtn" class="ghost" hidden>Install app</button>
  </header>

  <main>
    <section id="openPanel" class="open-panel">
      <div id="dropZone" class="drop-zone">
        <p class="drop-title">Drop a PDF, Word file, text file or photos of pages here</p>
        <div class="open-actions">
          <label class="btn primary">
            Open file
            <input id="fileInput" type="file" multiple
              accept=".pdf,.docx,.txt,.md,image/*,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" hidden />
          </label>
          <label class="btn">
            Scan with camera
            <input id="cameraInput" type="file" accept="image/*" capture="environment" multiple hidden />
          </label>
          <button id="pasteBtn" class="btn">Paste text</button>
        </div>
        <p class="hint">Files are read on your device and are never uploaded. Scanned pages are converted to text with OCR.</p>
      </div>

      <div id="pasteBox" class="paste-box" hidden>
        <textarea id="pasteText" rows="6" placeholder="Paste or type text here…"></textarea>
        <div class="row">
          <button id="pasteRead" class="btn primary">Read this</button>
          <button id="pasteCancel" class="btn ghost">Cancel</button>
        </div>
      </div>
    </section>

    <section id="status" class="status" hidden>
      <div class="status-text" id="statusText">Working…</div>
      <div class="bar"><div id="statusBar"></div></div>
    </section>

    <section id="docSection" hidden>
      <div class="doc-head">
        <h2 id="docTitle"></h2>
      </div>
      <article id="docText" class="doc-text" aria-live="off"></article>
      <div id="pageView" class="page-view" hidden></div>
    </section>
  </main>

  <aside id="figPanel" class="fig-panel" hidden aria-label="Figure">
    <div class="fig-head">
      <strong id="figTitle">Figure</strong>
      <div class="fig-actions">
        <button id="figGoto" class="btn small">Go to page</button>
        <button id="figClose" class="icon small" aria-label="Close figure" title="Close (Esc)">
          <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
        </button>
      </div>
    </div>
    <div id="figBody" class="fig-body"></div>
    <p id="figCaption" class="fig-caption"></p>
  </aside>

  <footer id="player" class="player" hidden>
    <div id="figChips" class="fig-chips" hidden aria-label="Figures mentioned here"></div>
    <div class="seek-row">
      <input id="seek" type="range" min="0" max="0" value="0" aria-label="Position" />
      <span id="posLabel" class="pos">0 / 0</span>
    </div>
    <div class="controls">
      <div class="ctl-side ctl-left">
        <button id="closeDoc" class="icon small" type="button" aria-label="Open another document" title="Open another document">
          <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 12H4V8h16v10z"/></svg>
        </button>
        <button id="viewBtn" class="icon small" type="button" hidden aria-label="Text view" title="Text view">
          <svg id="viewIcon" viewBox="0 0 24 24"></svg>
        </button>
      </div>
      <div class="ctl-center">
      <button id="prevBtn" class="icon" aria-label="Previous sentence" title="Previous (←)">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
      </button>
      <button id="playBtn" class="icon play" aria-label="Play" title="Play / pause (Space)">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="nextBtn" class="icon" aria-label="Next sentence" title="Next (→)">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
      <button id="settingsBtn" class="icon" aria-label="Voice settings" title="Voice settings">
        <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
      </button>
      </div>
      <div class="ctl-side ctl-right">
      <div id="speedRow" class="speed-wrap">
        <button id="speedBtn" class="speed-pill" type="button" aria-label="Reading speed" title="Reading speed"><span id="speedBtnVal">1.00×</span></button>
        <div class="speed-pop">
          <span class="pop-label">Speed</span>
          <input id="rate" type="range" min="0.5" max="2" step="0.05" aria-label="Reading speed" />
          <span id="rateVal" class="vol-val"></span>
        </div>
      </div>
      <div id="volumeRow" class="volume-row">
        <button id="muteBtn" class="icon small" type="button" aria-label="Mute" title="Volume">
          <svg id="volIcon" viewBox="0 0 24 24"></svg>
        </button>
        <div class="vol-slider">
          <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="Volume" />
          <span id="volVal" class="vol-val">100%</span>
        </div>
      </div>
      </div>
    </div>

    <div id="settings" class="settings" hidden>
      <label>Language
        <select id="langSelect"></select>
      </label>
      <label class="voice-label">Voice
        <select id="voiceSelect"></select>
      </label>
      <label>Pitch <span id="pitchVal"></span>
        <input id="pitch" type="range" min="0.7" max="1.3" step="0.05" />
      </label>
      <label>Sleep timer
        <select id="sleepSelect">
          <option value="0">Off</option>
          <option value="10">10 minutes</option>
          <option value="20">20 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">60 minutes</option>
        </select>
      </label>
      <label class="check-label"><input id="autoFig" type="checkbox" /> Open figures automatically while reading</label>
      <label>Figures in text view
        <select id="figPlace">
          <option value="printed">Where printed</option>
          <option value="mention">After first mention</option>
        </select>
      </label>
      <button id="previewBtn" class="btn small">Preview voice</button>
      <p id="voiceHint" class="hint"></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
